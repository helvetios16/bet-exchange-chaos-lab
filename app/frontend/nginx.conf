# =============================================================================
# nginx.conf del frontend
#
# Puntos clave para el comportamiento bajo carga y fallos:
#  - upstream con keepalive: sin el, cada request abre y cierra una conexion
#    TCP al backend. Bajo 5k RPS eso es 5k TIME_WAIT por segundo.
#  - proxy_next_upstream: si un pod del backend muere a mitad de request,
#    nginx reintenta contra OTRO pod. Es la resiliencia real a nivel de app.
#  - /healthz y /readyz separados igual que en el backend, por la misma razon:
#    readiness valida el backend, liveness no.
# =============================================================================

worker_processes auto;
# Cada conexion es un descriptor. Con mucho paralelismo hay que subir el limite.
worker_rlimit_nofile 65535;

# logs a stdout/stderr: Kubernetes los recoge. Nunca a fichero.
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # --- logs ---
    log_format json escape=json
      '{"ts":"$time_iso8601","remote_addr":"$remote_addr",'
      '"pod":"$hostname","method":"$request_method","uri":"$request_uri",'
      '"status":$status,"bytes":$body_bytes_sent,'
      '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
      '"upstream_addr":"$upstream_addr","upstream_status":"$upstream_status"}';
    access_log /dev/stdout json;

    # --- rendimiento ---
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 75s;
    keepalive_requests 1000;
    types_hash_max_size 4096;
    server_tokens off;

    client_max_body_size 10m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # --- rate limiting (zona propia, distinta a la del backend) ---
    # 10M de clave ~ 80k IPs. Increase si hace falta.
    limit_req_zone $binary_remote_addr zone=frontend_limit:10m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=frontend_conn:10m;
    # Burst 2x el rate: absorbe rafagas cortas sin descartar requests validos.
    limit_req_status 429;
    limit_conn_status 429;

    # --- upstream al backend ---
    # En NGINX open source el parametro `resolve` de un bloque upstream NO
    # existe (es feature de NGINX Plus). La alternativa soportada es poner el
    # nombre del Service en una variable, que se declara DENTRO del server
    # (la directiva `set` no es valida en el contexto http).
    #
    # Con esa variable nginx resuelve en runtime y respeta el TTL del
    # resolver, asi que los pods que caen se refrescan solos sin reiniciar.
    #
    # TRADE-OFF: sin bloque upstream no hay keepalive, porque en open source
    # el keepalive solo funciona dentro de un upstream con sus propios server.
    # Cada request abre conexion al backend. Es aceptable para este alcance;
    # si hiciera falta, el sitio correcto para el keepalive es el Service con
    # sessionAffinity, no nginx.
    # 127.0.0.11 es el DNS embebido de Docker y NO existe en kind/kubelet:
    # allí /etc/resolv.conf apunta al CoreDNS del cluster (10.96.0.10).
    # Se usa el nombre del servicio kube-dns, que resuelve vía el
    # resolv.conf del pod en el arranque y vale en cualquier cluster.
    resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

    # Si la resolucion DNS falla, se responde 502 en vez de reintentar en
    # bucle. El frontend sigue vivo: degrada sin caer.
    resolver_timeout 3s;

    server {
        listen 8080 default_server;
        server_name _;

        set $backend_upstream kuber-backend.kuber-app.svc.cluster.local:8080;

        # Metricas de nginx para Prometheus
        location = /nginx_status {
            stub_status;
            access_log off;
            allow 10.244.0.0/16;   # solo red de pods (kind)
            allow 10.96.0.0/16;    # red de services
            deny all;
        }

        # --- Liveness: superficial y barato. NO valida el backend. ---
        location = /healthz {
            access_log off;
            return 200 '{"status":"ok"}\n';
            add_header Content-Type application/json;
        }

        # --- Readiness: valida que el backend responde. ---
        # Si el backend cae, el frontend sale del Service y el Ingress
        # devuelve 503 limpio en vez de propagar el error.
        location = /readyz {
            access_log off;
            # Con variable en proxy_pass no se puede añadir path, asi que se
            # escribe la URL completa.
            proxy_pass http://$backend_upstream/health/ready;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
            proxy_next_upstream off;
        }

        # --- API: proxy al backend ---
        location /api/ {
            limit_req zone=frontend_limit burst=100 nodelay;
            limit_conn frontend_conn 100;

            # OJO: al usar variable en proxy_pass, nginx NO hace el rewrite
            # automatico del URI. Hay que pasar $request_uri explicitamente
            # para que /api/v1/items llegue como /api/v1/items al backend.
            proxy_pass http://$backend_upstream$request_uri;
            proxy_http_version 1.1;

            # Reintenta contra otro pod del backend si:
            #  - error de conexion (pod muerto / reiniciando)
            #  - timeout
            #  - 502/503/504 (pod que devuelve error)
            # ONLY si la request NO se ha enviado aun al upstream. Si ya se
            # envio, reintentar podria duplicar un POST.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 10s;

            # Timeouts alineados con los del ingress
            proxy_connect_timeout 3s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;

            # Headers de hop-by-hop y de reenvío correctos.
            # Connection: "" es lo que hace que funcione el keepalive con
            # el upstream.
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id      $request_id;
            proxy_set_header Connection        "";

            # Buffering activado con buffers acotados: una respuesta lenta
            # del backend no puede Grow sin límite la memoria del pod. Con
            # buffers configurados, el tiempo de espera se refleja igual en
            # las métricas de latencia.
            proxy_buffering on;
            proxy_buffers 16 16k;
            proxy_buffer_size 32k;
            proxy_busy_buffers_size 64k;

            # No interceptar errores: el status real del backend debe llegar
            # al cliente, que es lo que miden las pruebas de resiliencia.
            proxy_intercept_errors off;
        }

        # --- Frontend estatico ---
        location / {
            limit_req zone=frontend_limit burst=50 nodelay;

            root /usr/share/nginx/html;
            index index.html;

            try_files $uri $uri/ /index.html;
            add_header Cache-Control "public, max-age=300";
        }

        # --- API de health del backend expuesta para el runner de pruebas ---
        location = /backend/health {
            access_log off;
            proxy_pass http://$backend_upstream/api/v1/health;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
            proxy_next_upstream off;
        }
    }
}
