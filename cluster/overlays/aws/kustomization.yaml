# Overlay para EKS. Cambia respecto a la base (pensada para kind):
#   - StorageClass gp2 (EBS) en lugar de "standard"
#   - HPA del backend con tope 8 (3 nodos t3.medium no admiten 10 con holgura)
#   - Límites de tasa más altos: la prueba de carga sale de UNA sola IP y, con
#     los valores de la base, Traefik respondería 429 antes de que suba la CPU
#   - El ConfigMap de semillas no se aplica: lo crea scripts/deploy-aws.sh
#     (supera el límite de 256 KiB de `kubectl apply`)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - monitoring-netpol.yaml

patches:
  # Postgres en EC2 (infra/terraform) en vez de StatefulSet en EKS:
  # el Learner Lab no permite instalar aws-ebs-csi-driver, así que no hay
  # PVC persistente. El disco raíz del EC2 (EBS) sí persiste en stop.
  # Se borran StatefulSet + Services de Postgres y se apunta DB_HOST al EC2.
  - target: { kind: StatefulSet, name: kuber-postgres }
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: kuber-postgres
        namespace: kuber-data

  - target: { kind: Service, name: kuber-postgres }
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: kuber-postgres
        namespace: kuber-data

  - target: { kind: Service, name: kuber-postgres-client }
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: kuber-postgres-client
        namespace: kuber-data

  - target: { kind: PodDisruptionBudget, name: kuber-postgres-pdb }
    patch: |-
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: kuber-postgres-pdb
        namespace: kuber-data

  - target: { kind: NetworkPolicy, name: allow-postgres-from-backend }
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-postgres-from-backend
        namespace: kuber-data

  - target: { kind: NetworkPolicy, name: default-deny-all, namespace: kuber-data }
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: default-deny-all
        namespace: kuber-data

  - target: { kind: Deployment, name: kuber-backend }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: 127.0.0.1

  - target: { kind: NetworkPolicy, name: allow-backend }
    patch: |-
      - op: replace
        path: /spec/egress/0
        value:
          to:
            - ipBlock:
                cidr: 10.0.0.0/16
          ports:
            - protocol: TCP
              port: 5432

  - target: { kind: HorizontalPodAutoscaler, name: kuber-backend-hpa }
    patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 8

  - target: { kind: ConfigMap, name: kuber-app-config }
    patch: |-
      - op: replace
        path: /data/RATE_LIMIT_REQUESTS
        value: "600000"

  - target: { group: traefik.io, kind: Middleware, name: kuber-ratelimit }
    patch: |-
      - op: replace
        path: /spec/rateLimit/average
        value: 3000
      - op: replace
        path: /spec/rateLimit/burst
        value: 6000

  - target: { group: traefik.io, kind: Middleware, name: kuber-inflight }
    patch: |-
      - op: replace
        path: /spec/inFlightReq/amount
        value: 2000

  - target: { kind: ConfigMap, name: kuber-seed-data }
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: kuber-seed-data
