# Base reutilizable. El Makefile (kind) sigue aplicando los ficheros uno a uno;
# esta kustomization la consumen los overlays (cluster/overlays/aws).
# 02-secret.yaml NO se incluye: sus contraseñas son de ejemplo. En AWS los
# secretos los crea scripts/deploy-aws.sh con valores aleatorios.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-namespace.yaml
  - 01-configmap.yaml
  - 03-postgres.yaml
  - 04-backend.yaml
  - 05-frontend.yaml
  - 06-ingress.yaml
