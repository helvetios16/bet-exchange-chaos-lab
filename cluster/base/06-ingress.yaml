# =============================================================================
# Ingress — traefik (el que instala kind por defecto)
#
# Por que Ingress y no un Service LoadBalancer:
#  - kind no tiene metallb, asi que LoadBalancer queda EXTERNAL-IP pending
#  - en cloud real: LoadBalancer (AWS/GCP/Azure lo gestionan solos) o
#    Ingress con ALB/NLB/AGW segun el proveedor
#
# Anotaciones de traefik:
#  - retries: 2 -> si un pod del backend muere a mitad de la request, traefik
#    reintenta contra otro. Es la primera linea de tolerancia a fallos
#    DESPUES de los retries del cliente.
#  - responseForwarding.flush: evita buffering, importante para ver el
#    comportamiento real bajo carga
#  - timeouts alineados con terminationGracePeriod para que una request
#    nunca se corte a mitad
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kuber-ingress
  namespace: kuber-app
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    # Formato v3 del provider kubernetes-crd: <namespace>-<name>@kubernetescrd.
    # El anterior (kuber@kuber-middlewares) no resolvía y la ruta quedaba
    # huérfana.
    traefik.ingress.kubernetes.io/router.middlewares: >-
      kuber-app-kuber-ratelimit@kubernetescrd,
      kuber-app-kuber-inflight@kubernetescrd,
      kuber-app-kuber-retry@kubernetescrd,
      kuber-app-kuber-circuitbreaker@kubernetescrd
    # Reintentos ante fallo de un pod (backend caido a mitad de request)
    # (sin nativelb: ese campo no existe en las annotations de Traefik v3 y
    # su presencia hacía que Traefik descartara el Ingress entero con
    # "field not found, node: service". El Service ClusterIP ya balancea.)
    traefik.ingress.kubernetes.io/router.tls: "false"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "3"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-next-upstream: "error timeout http_502 http_503 http_504"
    nginx.ingress.kubernetes.io/proxy-next-upstream-tries: "2"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  # Sin bloque tls: no hay cert-manager en el lab y el secreto kuber-tls no
  # existe; declararlo hacía que Traefik marcara el router como erróneo.
  # Todo el tráfico de prueba es http://...:8080 (entrypoint web).
  rules:
    - host: kuber.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: kuber-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kuber-frontend
                port:
                  number: 80
---
# Middlewares: límites de tasa y resiliencia a nivel de borde.
# El rate limiting es lo que permite que las pruebas de estrés validen
# respuestas 429 en vez de tumbar el cluster.
#
# UN tipo por objeto: Traefik rechaza ("multi-types middleware not
# supported") un Middleware que combine varios. Se encadenan en la
# anotación router.middlewares del Ingress.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: kuber-ratelimit
  namespace: kuber-app
spec:
  # Límite de requests por IP.
  rateLimit:
    average: 200
    burst: 400
    period: 1s
    sourceCriterion:
      ipStrategy:
        depth: 1
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: kuber-inflight
  namespace: kuber-app
spec:
  # Tope de requests concurrentes por IP (protección adicional ante ráfagas).
  inFlightReq:
    amount: 64
    sourceCriterion:
      ipStrategy:
        depth: 1
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: kuber-retry
  namespace: kuber-app
spec:
  # Reintenta si un pod del backend muere a mitad de la petición.
  # El middleware `retry` solo acepta `attempts` e `initialInterval`.
  retry:
    attempts: 2
    initialInterval: 500ms
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: kuber-circuitbreaker
  namespace: kuber-app
spec:
  # Circuit breaker: si el backend no contesta, se degrada rápido en vez de
  # arrastrar al ingress entero.
  circuitBreaker:
    expression: 'NetworkErrorRatio() > 0.5'
    checkPeriod: 1s
    recoveryDuration: 30s
    responseCode: 503
