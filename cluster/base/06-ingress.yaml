# =============================================================================
# Ingress — traefik (el que instala kind por defecto)
#
# Por que Ingress y no un Service LoadBalancer:
#  - kind no tiene metallb, asi que LoadBalancer queda EXTERNAL-IP pending
#  - en cloud real: LoadBalancer (AWS/GCP/Azure lo gestionan solos) o
#    Ingress con ALB/NLB/AGW segun el proveedor
#
# Anotaciones de traefik:
#  - retries: 2 -> si un pod del backend muere a mitad de la request, traefik
#    reintenta contra otro. Es la primera linea de tolerancia a fallos
#    DESPUES de los retries del cliente.
#  - responseForwarding.flush: evita buffering, importante para ver el
#    comportamiento real bajo carga
#  - timeouts alineados con terminationGracePeriod para que una request
#    nunca se corte a mitad
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kuber-ingress
  namespace: kuber-app
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: kuber@kuber-middlewares
    # Reintentos ante fallo de un pod (backend caido a mitad de request)
    traefik.ingress.kubernetes.io/router.service.nativelb: "false"
    traefik.ingress.kubernetes.io/router.tls: "false"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "3"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-next-upstream: "error timeout http_502 http_503 http_504"
    nginx.ingress.kubernetes.io/proxy-next-upstream-tries: "2"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - kuber.local
      secretName: kuber-tls
  rules:
    - host: kuber.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: kuber-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kuber-frontend
                port:
                  number: 80
---
# Middleware: límites de tasa y resiliencia a nivel de borde.
# El rate limiting es lo que permite que las pruebas de estrés validen
# respuestas 429 en vez de tumbar el cluster.
#
# NOTA SOBRE LOS CAMPOS: en el CRD traefik.io/v1alpha1 de Traefik v3.1 este
# Middleware solo admite los middlewares enumerados abajo. No existen aquí
# `loadBalancer` ni `timeouts` (esos son campos de IngressRoute en otras
# versiones, y en v3.1 se han sustituido por middlewares propios), ni
# `retry.perTryTimeout` / `retry.retryOn`: el middleware `retry` de v3.1 solo
# acepta `attempts` e `initialInterval`.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: kuber-middlewares
  namespace: kuber-app
spec:
  # Límite de requests por IP. Sustituye al inexistente loadBalancer.maxConnPerIP.
  rateLimit:
    average: 200
    burst: 400
    period: 1s
    sourceCriterion:
      ipStrategy:
        depth: 1
  # Tope de requests concurrentes por IP (protección adicional ante ráfagas).
  inFlightReq:
    amount: 64
    sourceCriterion:
      ipStrategy:
        depth: 1
  # Reintenta si un pod del backend muere a mitad de la petición.
  retry:
    attempts: 2
    initialInterval: 500ms
  # Circuit breaker: si el backend no contesta, se degrada rápido en vez de
  # arrastrar al ingress entero.
  circuitBreaker:
    expression: 'NetworkErrorRatio().ratio(0.5) > 0.5'
    checkPeriod: 1s
    recoveryDuration: 30s
    responseCode: 503
