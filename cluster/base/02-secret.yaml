# =============================================================================
# Secretos de ejemplo — SOLO para desarrollo local con kind.
#
# En un cluster real: NO usar este archivo. Opciones recomendadas:
#   - External Secrets Operator  -> AWS Secrets Manager / Vault
#   - Sealed Secrets             -> cifrados con una clave del cluster
#   - SOPS + age                 -> cifrados en git
#
# Para produccion, este archivo esta marcado para ser ignorado via kustomize
# (ver cluster/overlays/prod/patches/). En dev se genera con:
#   kubectl create secret generic ... --dry-run=client -o yaml
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: kuber-postgres-secret
  namespace: kuber-data
  labels:
    app.kubernetes.io/name: postgres
type: Opaque
stringData:
  POSTGRES_PASSWORD: "dev-only-not-a-real-password"
  POSTGRES_SUPERUSER_PASSWORD: "dev-only-not-a-real-password"
---
apiVersion: v1
kind: Secret
metadata:
  name: kuber-backend-secret
  namespace: kuber-app
  labels:
    app.kubernetes.io/name: backend
type: Opaque
stringData:
  DB_PASSWORD: "dev-only-not-a-real-password"
  # Token de ejemplo para endpoints administrativos
  ADMIN_TOKEN: "dev-only-not-a-real-token"
---
