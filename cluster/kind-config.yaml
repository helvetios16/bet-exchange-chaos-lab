# =============================================================================
# kind (Kubernetes in Docker) — cluster local de 1 worker multi-nodo simulado
#
# Uso:  kind create cluster --config cluster/kind-config.yaml
# Docs: https://kind.sigs.k8s.io/docs/user/configuration/
# =============================================================================
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kuber

# -----------------------------------------------------------------------------
# Nodo de control plane
# -----------------------------------------------------------------------------
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true,topology.kubernetes.io/zone=us-east-1a"
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            # Necesario para que las pruebas de resiliencia midan bien el
            # impacto de reinicios del API server.
            service-node-port-range: "30000-32767"
    extraPortMappings:
      # Ingress (traefik) -> localhost:8080
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
      # Dashboard / metricas
      - containerPort: 30000
        hostPort: 30000
        protocol: TCP

  # -----------------------------------------------------------------------------
  # Worker 1
  # -----------------------------------------------------------------------------
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "workload=app"
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            service-node-port-range: "30000-32767"

  # -----------------------------------------------------------------------------
  # Worker 2 — existe para que las pruebas de tolerancia a fallos tengan
  # somewhere real a donde reubicar pods cuando un nodo muere.
  # -----------------------------------------------------------------------------
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "workload=app"

  # -----------------------------------------------------------------------------
  # Worker 3 — etiquetado para el autoscaler / PDB tests
  # -----------------------------------------------------------------------------
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "workload=spare"

# -----------------------------------------------------------------------------
# Networking: pods en 10.244.0.0/16, services en 10.96.0.0/16
# -----------------------------------------------------------------------------
networking:
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6443
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/16"
  # dnsClusterIP: deja que kind lo asigne
  disableDefaultCNI: false

# -----------------------------------------------------------------------------
# Kubelet: importante para las pruebas de esfuerzo. Con los defaults de kind
# el kubelet es muy conservador y el HPA de CPU nunca se dispara porque los
# requests son bajos respecto a los limites.
# -----------------------------------------------------------------------------
kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    apiServer:
      extraArgs:
        service-node-port-range: "30000-32767"
  - |
    kind: KubeletConfiguration
    # Mas headroom de CPU para que el HPA tenga margen de maniobra
    cpuManagerPolicy: none
    # Evitar que el kubelet mate pods antes que el HPA pueda escalar
    evictionHard:
      memory.available: "100Mi"
      nodefs.available: "10%"
      imagefs.available: "15%"
    evictionSoft:
      memory.available: "200Mi"
      nodefs.available: "20%"
      imagefs.available: "30%"
    serializeImagePulls: false
    imageGCHighThresholdPercent: 70
    imageGCLowThresholdPercent: 50
