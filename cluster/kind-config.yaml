# =============================================================================
# kind (Kubernetes in Docker) — cluster local de 1 worker multi-nodo simulado
#
# Uso:  kind create cluster --config cluster/kind-config.yaml
# Docs: https://kind.sigs.k8s.io/docs/user/configuration/
# =============================================================================
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kuber

# -----------------------------------------------------------------------------
# Nodo de control plane
# -----------------------------------------------------------------------------
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true,topology.kubernetes.io/zone=us-east-1a"
    # ingress-ready: `make traefik` fija Traefik a este nodo vía nodeSelector
    # (es el único con los puertos 80/443 mapeados al host). Las NetworkPolicy
    # de 04-backend.yaml permiten el namespace `traefik`: las dos piezas van
    # a juego o el ingress no llega al backend (default-deny).
    extraPortMappings:
      # Ingress (traefik, namespace `traefik`) -> localhost:8080
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
      # Dashboard / metricas
      - containerPort: 30000
        hostPort: 30000
        protocol: TCP

  # -----------------------------------------------------------------------------
  # Worker 1
  # -----------------------------------------------------------------------------
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "workload=app"

  # -----------------------------------------------------------------------------
  # Worker 2 — existe para que las pruebas de tolerancia a fallos tengan
  # somewhere real a donde reubicar pods cuando un nodo muere.
  # -----------------------------------------------------------------------------
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "workload=app"

  # -----------------------------------------------------------------------------
  # Worker 3 — etiquetado para el autoscaler / PDB tests
  # -----------------------------------------------------------------------------
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "workload=spare"

# -----------------------------------------------------------------------------
# Networking: pods en 10.244.0.0/16, services en 10.96.0.0/16
# -----------------------------------------------------------------------------
networking:
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6443
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/16"
  # dnsClusterIP: deja que kind lo asigne
  disableDefaultCNI: false

# -----------------------------------------------------------------------------
# NOTA: sin kubeadmConfigPatches de ClusterConfiguration/KubeletConfiguration.
# - service-node-port-range 30000-32767 ya es el default de kind: el patch era
#   un no-op.
# - El bloque KubeletConfiguration iba sin apiVersion y con evictionHard que
#   kubeadm rechaza: el kubelet no arrancaba, el apiserver (static pod) nunca
#   subía y `kubeadm init` moría en wait-control-plane. Verificado con
#   kind v0.24.0 y v0.33.0.
# -----------------------------------------------------------------------------
