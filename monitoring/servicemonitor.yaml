# Prometheus lee /metrics del backend (http_requests_total, latencias, pool de
# BD, circuit breaker...).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kuber-backend
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames: [kuber-app]
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
